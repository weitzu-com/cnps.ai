server {
    server_name crm-api.cnps.ai;
    client_max_body_size 50m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ~ ^/rest/(companies|people)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_hide_header X-Powered-By;
    }
    location /objects {
    proxy_read_timeout 125s;

        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

    }
    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
    }
    location / { return 404; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/crm-api.cnps.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/crm-api.cnps.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = crm-api.cnps.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name crm-api.cnps.ai;
    return 404; # managed by Certbot


}